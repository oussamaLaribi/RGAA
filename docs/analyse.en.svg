  <desc id="description">src/app/app.html — 11:3      critical  image-alt                Images must have alternative text — &lt;img src=&quot;product.jpg&quot;&gt; — WCAG 1.1.1  ·  RGAA 1.1, 1.2 — 12:3      critical  button-name              Buttons must have discernible text — &lt;button&gt;&lt;svg viewBox=&quot;0 0 10 10&quot;&gt;&lt;path d=&quot;M0 0h10v10H0z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt; — WCAG 4.1.2  ·  RGAA 11.9 — 14:5      critical  label                    Form elements must have labels — &lt;input type=&quot;email&quot;&gt; — WCAG 4.1.2  ·  RGAA 11.1, 11.2 — 14:5      minor     rgaa-missing-autocomplete Expected autocomplete=&quot;email&quot; — &lt;input type=&quot;email&quot;&gt; — WCAG 1.3.5  ·  RGAA 11.13 — 17:5      moderate  rgaa-group-without-fieldset 2 &quot;livraison&quot; fields are not grouped under a legend — &lt;input type=&quot;radio&quot; name=&quot;livraison&quot; id=&quot;rapide&quot;&gt; — WCAG 1.3.1  ·  RGAA 11.5, 11.6 — 22:3      serious   link-name                Links must have discernible text</desc>
