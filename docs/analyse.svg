  <desc id="description">src/app/app.component.html — 3:3       critique  image-alt                Les images doivent avoir une alternative textuelle — &lt;img src=&quot;produit.jpg&quot;&gt; — WCAG 1.1.1  ·  RGAA 1.1, 1.2 — 4:3       critique  button-name              Les boutons doivent avoir un texte perceptible — &lt;button&gt;&lt;svg viewBox=&quot;0 0 10 10&quot;&gt;&lt;path d=&quot;M0 0h10v10H0z&quot;&gt;&lt;/path&gt;&lt;/svg&gt;&lt;/button&gt; — WCAG 4.1.2  ·  RGAA 11.9 — 6:5       critique  image-alt                Les images doivent avoir une alternative textuelle — &lt;img src=&quot;avatar.png&quot;&gt; — WCAG 1.1.1  ·  RGAA 1.1, 1.2 — 11:5      majeur    listitem                 Les éléments &lt;li&gt; doivent être contenus dans un élément &lt;ul&gt; ou &lt;ol&gt; — &lt;li&gt;un&lt;/li&gt; — WCAG 1.3.1  ·  RGAA 9.3 — 11:5      majeur    listitem                 Les éléments &lt;li&gt; doivent être contenus dans un élément &lt;ul&gt; ou &lt;ol&gt; — &lt;li&gt;deux&lt;/li&gt; — WCAG 1.3.1  ·  RGAA 9.3 — 13:3      moyen     heading-order            Les niveaux de titre doivent s’incrémenter d’un seul niveau à la fois</desc>
