name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Declared explicitly rather than left to the repository default, which an
# organisation setting can widen without anyone noticing. This workflow only
# needs to read the code: it publishes nothing and comments nowhere.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Explicit rather than left to the other targets' dependsOn: those build a
      # package's dependencies, not the package itself, and the bridge check
      # below reads dist/ directly. Relying on a side effect here would break the
      # day a target's dependencies change.
      - name: Compilation
        run: npm run build

      - name: Typage strict
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Again in French. The console language now follows the environment, and
      # this runner has none set — so a test that quietly depends on the ambient
      # locale passes here and fails on a French machine, or the reverse, which
      # is exactly what happened when detection landed. Running the suite under
      # both makes that dependency a failure rather than a surprise.
      - name: Tests, sous une locale française
        run: npm test
        env:
          LC_ALL: fr_FR.UTF-8
          LANG: fr_FR.UTF-8

      # The bridge is the claim the whole product rests on, so it is verified
      # against a real Angular AOT build rather than only at the unit level.
      - name: Installer l'application de test
        run: npm ci
        working-directory: apps/fixture-app

      - name: Vérifier le pont de bout en bout
        run: npm run verify:bridge
